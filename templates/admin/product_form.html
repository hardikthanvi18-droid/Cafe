{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
    <div class="bg-white p-8 rounded-3xl border border-[#F0DDE5] shadow-sm">
        <h1 class="text-2xl font-serif font-bold text-[#3D3035] mb-6">Add New Café Delight</h1>

        <form method="POST" action="{{ url_for('admin.add_product') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-[#806F77] mb-1">Product Name *</label>
                <input type="text" name="name" required placeholder="e.g. Lavender Iced Latte" class="w-full text-xs px-3 py-2.5 rounded-xl border border-[#F0DDE5] focus:outline-none focus:border-[#C96F91]">
            </div>
            <div>
                <label class="block text-xs font-medium text-[#806F77] mb-1">Category *</label>
                <select name="category_id" required class="w-full text-xs px-3 py-2.5 rounded-xl border border-[#F0DDE5] focus:outline-none focus:border-[#C96F91] bg-white">
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-[#806F77] mb-1">Price (₹) *</label>
                <input type="number" step="0.01" name="price" required placeholder="240.00" class="w-full text-xs px-3 py-2.5 rounded-xl border border-[#F0DDE5] focus:outline-none focus:border-[#C96F91]">
            </div>
            <div>
                <label class="block text-xs font-medium text-[#806F77] mb-1">Description *</label>
                <textarea name="description" rows="3" required placeholder="Artisanal description of this culinary drink or bakery treat..." class="w-full text-xs px-3 py-2 rounded-xl border border-[#F0DDE5] focus:outline-none focus:border-[#C96F91]"></textarea>
            </div>
            <div>
                <label class="block text-xs font-medium text-[#806F77] mb-1">High-Res Image URL</label>
                <input type="url" name="image_url" placeholder="https://images.unsplash.com/..." class="w-full text-xs px-3 py-2.5 rounded-xl border border-[#F0DDE5] focus:outline-none focus:border-[#C96F91]">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-[#806F77] mb-1">Dietary Tag</label>
                    <select name="dietary" class="w-full text-xs px-3 py-2.5 rounded-xl border border-[#F0DDE5] bg-white">
                        <option value="Vegetarian">Vegetarian</option>
                        <option value="Eggless">Eggless</option>
                        <option value="Vegan">Vegan</option>
                        <option value="Gluten-Free">Gluten-Free</option>
                    </select>
                </div>
                <div class="flex flex-col justify-center gap-2 pt-4">
                    <label class="flex items-center gap-2 text-xs text-[#3D3035]">
                        <input type="checkbox" name="is_available" value="1" checked class="text-[#C96F91]"> Available for ordering
                    </label>
                    <label class="flex items-center gap-2 text-xs text-[#3D3035]">
                        <input type="checkbox" name="is_featured" value="1" class="text-[#C96F91]"> Feature on Homepage
                    </label>
                </div>
            </div>

            <div class="pt-4 flex justify-end gap-3">
                <a href="{{ url_for('admin.products') }}" class="px-5 py-2.5 border border-[#F0DDE5] text-xs font-semibold rounded-full hover:bg-gray-50">Cancel</a>
                <button type="submit" class="px-6 py-2.5 bg-[#C96F91] text-white text-xs font-semibold rounded-full hover:bg-[#b05d7e]">Save Product</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
