{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="text-center max-w-2xl mx-auto mb-12">
        <span class="text-xs uppercase tracking-widest text-[#C96F91] font-bold">Pastel Moments</span>
        <h1 class="text-4xl font-serif font-bold text-[#3D3035] mt-1">Café Visual Gallery</h1>
        <p class="text-sm text-[#806F77] mt-2">A visual peek into our latte art, freshly baked treats, and cozy seating corners.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <div class="rounded-2xl overflow-hidden border border-[#F0DDE5] h-64 group">
            <img src="https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=800&q=80" alt="Rose Latte Art" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        </div>
        <div class="rounded-2xl overflow-hidden border border-[#F0DDE5] h-64 group">
            <img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=800&q=80" alt="Fresh Butter Croissant" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        </div>
        <div class="rounded-2xl overflow-hidden border border-[#F0DDE5] h-64 group">
            <img src="https://images.unsplash.com/photo-1579954115545-a95591f28bfc?auto=format&fit=crop&w=800&q=80" alt="Strawberry Shake" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        </div>
        <div class="rounded-2xl overflow-hidden border border-[#F0DDE5] h-64 group">
            <img src="https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=800&q=80" alt="Strawberry Cheesecake Slice" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        </div>
        <div class="rounded-2xl overflow-hidden border border-[#F0DDE5] h-64 group">
            <img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=800&q=80" alt="Fudge Brownie" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        </div>
        <div class="rounded-2xl overflow-hidden border border-[#F0DDE5] h-64 group">
            <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80" alt="Cafe Window Seating" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        </div>
        <div class="rounded-2xl overflow-hidden border border-[#F0DDE5] h-64 group">
            <img src="https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&w=800&q=80" alt="Matcha Cloud Cooler" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        </div>
        <div class="rounded-2xl overflow-hidden border border-[#F0DDE5] h-64 group">
            <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80" alt="Cinnamon Rolls" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
        </div>
    </div>
</div>
{% endblock %}
